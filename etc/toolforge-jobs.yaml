---
- name: hay-directory-crawl
  command: php /data/project/hay/lib/crawl-tools.php
  image: php8.4
  schedule: "@daily"
  emails: onfailure
- name: hay-propbrowse-getprops
  command: cd $PWD && ./etc/wikidata-props/env/bin/python ./etc/wikidata-props/get-wikidata-props.py
  image: python3.13
  schedule: "@daily"
  emails: onfailure
- name: hay-sdsearch-locales
  command: node /data/project/hay/public_html/sdsearch/etc/update-locales.js
  image: node20
  schedule: "@daily"
  emails: onfailure
- name: hay-depictor-locales
  command: node /data/project/hay/public_html/depictor/etc/update-locales.js
  image: node20
  schedule: "@daily"
  emails: onfailure
- name: hay-parse-access-log
  command: cd $HOME/etc/parse-tools-access && $HOME/.local/bin/uv run $HOME/etc/parse-tools-access/parse.py $HOME/tools-access.log --csv $HOME/public_html/stats/tools-access.csv --totals-csv $HOME/public_html/stats/tools-access-totals.csv --chart $HOME/public_html/stats/tools-access.png
  image: python3.11
  schedule: "@daily"
  mem: 512Mi